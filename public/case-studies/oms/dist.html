<style>
/* === css/tokens.css === */
/* ============================================================
   OMS v3 — Design tokens (v2: "product" identity)
   A light, clean SaaS system in the spirit of Untitled UI —
   the design-system family Novatr's own v2.0 screens were built
   on — crossed with Linear's structural discipline (left nav,
   generous whitespace, real elevation instead of neon accents).
   Neutral gray carries a faint cool/indigo bias rather than being
   flat gray; brand indigo/violet is Untitled UI's own default
   "Brand" swatch family, not a Novatr-specific color, since this
   is a v3 rebuild exploring the product's own direction — not a
   reskin of the portfolio (arcept.in) that will eventually host it.
   ============================================================ */

:root {
  /* ---- neutrals (cool gray, Untitled-UI "Gray" scale) ---- */
  --gray-25:  #fcfcfd;
  --gray-50:  #f9fafb;
  --gray-100: #f2f4f7;
  --gray-200: #eaecf0;
  --gray-300: #d0d5dd;
  --gray-400: #98a2b3;
  --gray-500: #667085;
  --gray-600: #475467;
  --gray-700: #344054;
  --gray-800: #1d2939;
  --gray-900: #101828;

  /* ---- surfaces ---- */
  --bg: var(--gray-50);        /* page background */
  --surface: #ffffff;          /* card / panel surface */
  --surface-2: var(--gray-50); /* subtle recessed surface (table heads, wells) */
  --surface-hover: var(--gray-50);
  --surface-active: var(--gray-100);
  --line: var(--gray-200);     /* default border */
  --line-strong: var(--gray-300);
  --line-faint: #f0f1f4;

  /* ---- text ---- */
  --graphite: var(--gray-500); /* muted / tertiary text */
  --fog: var(--gray-600);      /* secondary text */
  --silver: var(--gray-700);   /* primary body text */
  --paper: var(--gray-900);    /* high-emphasis text / headings */
  --on-brand: #ffffff;

  /* ---- brand accent: indigo/violet (Untitled UI "Brand" default) ---- */
  --brand-25:  #fcfaff;
  --brand-50:  #f9f5ff;
  --brand-100: #f4ebff;
  --brand-200: #e9d7fe;
  --brand-300: #d6bbfb;
  --brand-500: #9e77ed;
  --brand-600: #7f56d9;
  --brand-700: #6941c6;
  --redline: var(--brand-600);         /* legacy alias, still used across components */
  --redline-hover: var(--brand-700);
  --redline-press: #5b3aa8;
  --redline-wash: var(--brand-50);
  --redline-wash-strong: var(--brand-100);
  --redline-text: var(--brand-700);

  /* ---- semantic status (kept distinct from brand) ---- */
  --signal-blue: #175cd3;
  --signal-blue-wash: #eff8ff;
  --signal-blue-line: #b2ddff;
  --signal-amber: #b54708;
  --signal-amber-wash: #fffaeb;
  --signal-amber-line: #fedf89;
  --signal-green: #067647;
  --signal-green-wash: #ecfdf3;
  --signal-green-line: #abefc6;
  --signal-red: #b42318;
  --signal-red-wash: #fef3f2;
  --signal-red-line: #fecdca;
  --signal-gray: var(--gray-600);
  --signal-gray-wash: var(--gray-100);
  --signal-gray-line: var(--gray-200);

  /* ---- chart data colors ---- */
  --chart-1: #7f56d9;
  --chart-2: #f79009;
  --chart-3: #12b76a;
  --chart-4: #98a2b3;

  /* ---- type families ---- */
  --font-sans: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* ---- type scale ---- */
  --text-display: clamp(2.75rem, 5.5vw, 5rem);
  --text-h1: clamp(1.75rem, 2.8vw, 2.25rem);
  --text-h2: 1.375rem;
  --text-h3: 1.0625rem;
  --text-body: 0.9375rem;
  --text-small: 0.8125rem;
  --text-caption: 0.75rem;
  --text-micro: 0.6875rem;

  /* ---- spacing ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;
  --space-10: 128px;

  /* ---- radius (Untitled UI runs generous) ---- */
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 999px;
  --radius-none: 0px;

  /* ---- elevation — real, soft shadows (the thing this system uses
     instead of hairlines-only) ---- */
  --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);
  --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.10), 0 1px 2px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 8px -2px rgba(16, 24, 40, 0.10), 0 2px 4px -2px rgba(16, 24, 40, 0.06);
  --shadow-lg: 0 12px 16px -4px rgba(16, 24, 40, 0.08), 0 4px 6px -2px rgba(16, 24, 40, 0.03);
  --shadow-xl: 0 20px 24px -4px rgba(16, 24, 40, 0.08), 0 8px 8px -4px rgba(16, 24, 40, 0.03);
  --focus-ring: 0 0 0 4px var(--brand-100);

  /* ---- motion — a touch of overshoot for the "spring" feel, since
     this build has no Motion/Framer Motion dependency available
     (npm blocked in the build sandbox) and hand-rolls that language
     in CSS easings + a damped-follow JS primitive instead ---- */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 140ms;
  --dur-base: 220ms;
  --dur-slow: 380ms;
  --dur-slower: 600ms;

  /* ---- back-compat aliases (older component CSS/JS still reads these
     names — pointed at the new light surfaces so nothing needs a
     line-by-line rewrite) ---- */
  --ink: var(--bg);
  --steel: var(--surface);
  --steel-2: var(--surface-hover);
  --steel-3: var(--surface-active);

  /* ---- layout ---- */
  --nav-h: 60px;
  --sidebar-w: 244px;
  --max-w: 1180px;
  --glow-redline: radial-gradient(
    60% 50% at 50% 0%,
    rgba(127, 86, 217, 0.10) 0%,
    rgba(127, 86, 217, 0) 70%
  );
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 1ms;
    --dur-base: 1ms;
    --dur-slow: 1ms;
    --dur-slower: 1ms;
  }
}


/* === css/base.css === */
/* ============================================================
   OMS v3 — Base / reset
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--silver);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button {
  font: inherit; color: inherit; background: none; border: none;
  appearance: none; -webkit-appearance: none; text-align: inherit; margin: 0;
}
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
/* default size for the hand-authored icon set (js/icons.js) — anything
   with a more specific selector (e.g. `.confirm-icon svg`) still wins */
.i-icon { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
input, select, textarea, button { font-family: inherit; }

h1, h2, h3 {
  color: var(--paper);
  font-weight: 550;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.mono, .tnum {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--text-micro);
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--graphite);
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

/* focus states — always visible, never suppressed */
:focus-visible {
  outline: 2px solid var(--redline);
  outline-offset: 2px;
  border-radius: 3px;
}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--redline);
  outline-offset: 2px;
}

/* scrollbars — thin, quiet */
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 6px;
  border: 2px solid var(--ink);
}
*::-webkit-scrollbar-thumb:hover { background: #454a52; }

::selection { background: var(--redline); color: var(--paper); }

.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding-left: var(--space-6);
  padding-right: var(--space-6);
}
@media (max-width: 640px) {
  .container { padding-left: var(--space-4); padding-right: var(--space-4); }
}

.hairline { border: 1px solid var(--line); }
.hairline-t { border-top: 1px solid var(--line); }
.hairline-b { border-bottom: 1px solid var(--line); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  padding: 9px 16px;
  font-size: var(--text-small);
  font-weight: 550;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out),
              border-color var(--dur-fast) var(--ease-out),
              color var(--dur-fast) var(--ease-out),
              transform var(--dur-fast) var(--ease-out),
              box-shadow var(--dur-fast) var(--ease-out);
  white-space: nowrap;
  user-select: none;
}
.btn:active { transform: translateY(1px) scale(0.98); }
.btn-primary {
  background: var(--redline);
  color: var(--on-brand);
  box-shadow: var(--shadow-xs);
}
.btn-primary:hover { background: var(--redline-hover); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.btn-primary:active { background: var(--redline-press); transform: translateY(1px) scale(0.98); box-shadow: var(--shadow-xs); }

.btn-secondary {
  background: var(--surface);
  border-color: var(--line);
  color: var(--silver);
  box-shadow: var(--shadow-xs);
}
.btn-secondary:hover { background: var(--surface-hover); border-color: var(--line-strong); box-shadow: var(--shadow-sm); transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  color: var(--fog);
}
.btn-ghost:hover { background: var(--steel-2); color: var(--silver); }

.btn-sm { padding: 6px 11px; font-size: var(--text-caption); }

.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn[disabled]:hover { background: inherit; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: var(--text-micro);
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  line-height: 1.6;
}
.pill-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex: none;
}
.pill-blue   { background: var(--signal-blue-wash);  color: var(--signal-blue); }
.pill-amber  { background: var(--signal-amber-wash); color: var(--signal-amber); }
.pill-green  { background: var(--signal-green-wash); color: var(--signal-green); }
.pill-red    { background: var(--signal-red-wash);   color: var(--signal-red); }
.pill-gray   { background: var(--signal-gray-wash);  color: var(--graphite); }

.card {
  background: var(--steel);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xs);
}

.visually-hidden-when-empty:empty { display: none; }

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--paper);
  color: var(--ink);
  padding: 10px 16px;
  z-index: 999;
  border-radius: 0 0 8px 0;
}
.skip-link:focus { left: 0; }


/* === css/app.css === */
/* ============================================================
   OMS v3 — App shell + shared product-UI components
   ============================================================ */

#app-view { display: none; min-height: 100vh; }
#app-view.is-active { display: block; }

/* ---------------- App shell: left sidebar + main ---------------- */
.app-shell { display: flex; min-height: 100vh; background: var(--bg); align-items: stretch; }
.app-main { flex: 1; min-width: 0; }

.mobile-topbar {
  display: none; align-items: center; gap: var(--space-3);
  height: var(--nav-h); padding: 0 var(--space-4);
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.mobile-topbar .brand-mark { width: 20px; height: 20px; }
.mobile-topbar-title { font-size: var(--text-small); font-weight: 600; color: var(--paper); }

.sidebar-scrim {
  display: none; position: fixed; inset: 0; background: rgba(16, 24, 40, 0.45);
  z-index: 110; opacity: 0; transition: opacity var(--dur-base) var(--ease-out);
}
.sidebar-scrim.is-open { display: block; opacity: 1; }

.sidebar {
  width: var(--sidebar-w); flex: none;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: var(--space-4) var(--space-3) var(--space-3);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: var(--space-1) var(--space-2) var(--space-4);
  font-weight: 600; font-size: 14px; color: var(--paper); letter-spacing: -0.005em;
  width: 100%;
}
.brand-mark {
  width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(155deg, var(--brand-500), var(--brand-700));
  box-shadow: var(--shadow-sm);
  position: relative; flex: none;
}
.brand-mark::before, .brand-mark::after {
  content: ""; position: absolute; background: var(--on-brand); border-radius: 1px;
}
.brand-mark::before { left: 7px; right: 7px; top: 11px; height: 2px; }
.brand-mark::after { top: 7px; bottom: 7px; left: 11px; width: 2px; }
.brand-sub { color: var(--graphite); font-weight: 400; }

.sidebar-workspace {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 8px 9px;
  cursor: pointer; color: var(--silver); font-size: var(--text-caption);
  margin-bottom: var(--space-4);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.sidebar-workspace:hover { border-color: var(--line-strong); background: var(--surface-hover); box-shadow: var(--shadow-xs); }
.sidebar-workspace .avatar { width: 26px; height: 26px; font-size: 10px; }
.sidebar-workspace .ws-text { flex: 1; min-width: 0; text-align: left; }
.sidebar-workspace .ws-name { font-size: var(--text-small); color: var(--paper); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-workspace .ws-role { font-family: var(--font-mono); color: var(--brand-700); font-size: 10px; font-weight: 600; }
.sidebar-workspace svg { width: 14px; height: 14px; color: var(--graphite); flex: none; }

.role-menu {
  position: absolute; left: var(--space-3); right: var(--space-3); top: 108px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); max-width: 300px;
  box-shadow: var(--shadow-xl);
  padding: 6px; z-index: 60; max-height: min(60vh, 480px); overflow-y: auto;
  opacity: 0; transform: translateY(-6px) scale(0.98);
  pointer-events: none;
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-spring);
}
.role-menu.is-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.role-menu-label {
  padding: 8px 10px 4px; font-family: var(--font-mono); font-size: var(--text-micro);
  color: var(--graphite); text-transform: uppercase; letter-spacing: 0.08em;
}
.role-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: var(--radius-sm); border: none; background: none;
  cursor: pointer; text-align: left; color: var(--silver);
  transition: background var(--dur-fast) var(--ease-out);
}
.role-menu-item:hover { background: var(--surface-hover); }
.role-menu-item.is-current { background: var(--brand-50); }
.role-menu-item .name { font-size: var(--text-small); color: var(--paper); }
.role-menu-item .meta { font-size: var(--text-micro); color: var(--graphite); font-family: var(--font-mono); }

.sidebar-nav { position: relative; display: flex; flex-direction: column; gap: 1px; }
.sidebar-nav-indicator {
  position: absolute; left: 0; top: 0; width: 100%; height: 34px;
  background: var(--brand-50); border-radius: var(--radius-sm); z-index: 0;
  pointer-events: none; opacity: 0;
}
.sidebar-nav-indicator.is-visible { opacity: 1; }
.sidebar-link {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-small); color: var(--fog); font-weight: 500;
  background: none; border: none; cursor: pointer; width: 100%; text-align: left;
  transition: color var(--dur-fast) var(--ease-out);
}
.sidebar-link:hover { color: var(--paper); }
.sidebar-link.is-active { color: var(--brand-700); font-weight: 600; }
.sidebar-link svg { width: 17px; height: 17px; flex: none; }
.sidebar-link .tag-soon {
  margin-left: auto; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.03em;
  color: var(--graphite); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 5px;
}
.sidebar-link[disabled] { cursor: not-allowed; opacity: 0.55; }

.sidebar-foot { margin-top: auto; padding-top: var(--space-3); border-top: 1px solid var(--line-faint); }
.sidebar-foot .eyebrow { padding: 0 var(--space-2); }

@media (max-width: 900px) {
  .mobile-topbar { display: flex; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: min(84vw, 300px);
    transform: translateX(-100%); box-shadow: var(--shadow-xl); z-index: 120;
    transition: transform var(--dur-slow) var(--ease-out);
  }
  .sidebar.is-open { transform: translateX(0); }
}

.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--steel-3); color: var(--fog);
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  border: 1px solid var(--line-strong); flex: none;
}

.icon-btn {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); border: 1px solid transparent; background: none;
  color: var(--fog); cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.icon-btn:hover { background: var(--steel-2); color: var(--silver); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------------- Page shell ---------------- */
.page { padding: var(--space-6) var(--space-5) var(--space-9); max-width: var(--max-w); margin: 0 auto; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap;
}
.page-title { font-size: var(--text-h1); color: var(--paper); font-weight: 550; letter-spacing: -0.015em; }
.page-sub { color: var(--graphite); font-size: var(--text-small); margin-top: 4px; }

/* generic section card */
.panel { background: var(--steel); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-4) var(--space-3);
  border-bottom: 1px solid var(--line-faint);
}
.panel-title { font-size: var(--text-small); font-weight: 600; color: var(--paper); }
.panel-body { padding: var(--space-4); }

/* ---------------- Dashboard grid ---------------- */
.dash-top-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--space-4); margin-bottom: var(--space-4); }
@media (max-width: 900px) { .dash-top-grid { grid-template-columns: 1fr; } }

.range-pills { display: flex; gap: 4px; background: var(--steel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px; }
.range-pill {
  border: none; background: none; color: var(--graphite); font-size: var(--text-caption);
  padding: 5px 10px; border-radius: 5px; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.range-pill:hover { color: var(--silver); }
.range-pill.is-active { background: var(--steel-3); color: var(--paper); }

.revenue-figure { font-family: var(--font-mono); font-size: 2.1rem; font-weight: 600; color: var(--paper); letter-spacing: -0.01em; }
.revenue-label { color: var(--graphite); font-size: var(--text-caption); margin-bottom: 2px; }
.revenue-badge {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
  font-size: var(--text-micro); color: var(--signal-green);
  background: var(--signal-green-wash); padding: 3px 8px; border-radius: var(--radius-pill);
  font-family: var(--font-mono);
}
.revenue-split { display: flex; gap: var(--space-6); margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--line-faint); }
.revenue-split-item .v { font-family: var(--font-mono); font-size: 1.05rem; color: var(--silver); font-weight: 600; }
.revenue-split-item .l { font-size: var(--text-caption); color: var(--graphite); margin-top: 2px; }

.trend-wrap { margin-top: var(--space-4); position: relative; }
.trend-svg { width: 100%; height: 92px; display: block; overflow: visible; }
.trend-path { fill: none; stroke: var(--redline); stroke-width: 2; }
.trend-fill { fill: url(#trendGradient); }
.trend-dot { fill: var(--redline); stroke: var(--ink); stroke-width: 2; }
.trend-tooltip {
  position: absolute; pointer-events: none; background: var(--steel-3); border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 6px 10px; font-size: var(--text-micro); white-space: nowrap;
  transform: translate(-50%, -120%); opacity: 0; transition: opacity var(--dur-fast) var(--ease-out);
  font-family: var(--font-mono); color: var(--paper); z-index: 5;
}
.trend-tooltip.is-visible { opacity: 1; }

.chart-tabs { display: flex; gap: 2px; }
.chart-tab {
  border: none; background: none; color: var(--graphite); font-size: var(--text-caption);
  padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.chart-tab:hover { color: var(--silver); }
.chart-tab.is-active { background: var(--steel-2); color: var(--paper); }
.chart-tab svg { width: 13px; height: 13px; }

.bars { display: flex; flex-direction: column; gap: 10px; margin-top: var(--space-3); }
.bar-row { display: grid; grid-template-columns: 108px 1fr 44px; align-items: center; gap: 10px; }
.bar-row .bl { font-size: var(--text-caption); color: var(--fog); }
.bar-track { height: 8px; background: var(--line-faint); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; width: 0%; transition: width var(--dur-slower) var(--ease-out); }
.bar-row .bv { font-family: var(--font-mono); font-size: var(--text-caption); color: var(--silver); text-align: right; }

.donut-wrap { display: flex; align-items: center; gap: var(--space-5); margin-top: var(--space-3); }
.donut-svg circle { transition: stroke-dashoffset var(--dur-slower) var(--ease-out); }
.donut-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.donut-legend-item { display: flex; align-items: center; gap: 8px; font-size: var(--text-caption); color: var(--fog); }
.donut-legend-item .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.donut-legend-item .val { margin-left: auto; font-family: var(--font-mono); color: var(--silver); }

/* ---------------- Funnel row ---------------- */
.funnel-block { margin-bottom: var(--space-6); }
.funnel-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
.funnel-block-title { display: flex; align-items: center; gap: 10px; font-size: var(--text-small); font-weight: 600; color: var(--paper); }
.tab-toggle { display: flex; background: var(--steel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.tab-toggle button {
  border: none; background: none; color: var(--graphite); font-size: var(--text-caption); font-weight: 550;
  padding: 5px 12px; border-radius: 5px; cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast);
}
.tab-toggle button.is-active { background: var(--steel-3); color: var(--paper); }

.funnel-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
@media (max-width: 900px) { .funnel-row { grid-template-columns: 1fr 1fr; } }
.funnel-card {
  background: var(--steel); border: 1px solid var(--line); border-radius: var(--radius-md);
  padding: var(--space-4); position: relative; overflow: hidden; box-shadow: var(--shadow-xs);
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.funnel-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.funnel-card .step-index {
  position: absolute; top: var(--space-4); right: var(--space-4);
  font-family: var(--font-mono); font-size: var(--text-micro); color: var(--line-strong);
}
.funnel-card .fc-label { font-size: var(--text-caption); color: var(--graphite); margin-bottom: 6px; }
.funnel-card .fc-value { font-family: var(--font-mono); font-size: 1.55rem; font-weight: 600; color: var(--paper); }
.funnel-card .fc-denom { font-family: var(--font-mono); font-size: 1rem; color: var(--graphite); font-weight: 500; }
.funnel-card .fc-breakdown { margin-top: var(--space-3); display: flex; flex-direction: column; gap: 6px; }
.fc-breakdown-row { display: flex; align-items: center; justify-content: space-between; font-size: var(--text-micro); }
.fc-breakdown-row .lbl { display: flex; align-items: center; gap: 6px; color: var(--fog); }
.fc-breakdown-row .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.fc-breakdown-row .val { font-family: var(--font-mono); color: var(--silver); }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-top: var(--space-3); }
@media (max-width: 900px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }
.kpi-card { background: var(--steel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); box-shadow: var(--shadow-xs); transition: box-shadow var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.kpi-card .kl { font-size: var(--text-caption); color: var(--graphite); margin-bottom: 6px; }
.kpi-card .kv { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 600; color: var(--paper); }
.kpi-card .kd { font-size: var(--text-micro); color: var(--signal-green); margin-top: 4px; font-family: var(--font-mono); }

/* ---------------- Team / drill-down tables ---------------- */
.drill-wrap { margin-top: var(--space-6); }
.drill-search { position: relative; width: 240px; }
.drill-search input {
  width: 100%; background: var(--steel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 10px 7px 32px; color: var(--silver); font-size: var(--text-small);
}
.drill-search input::placeholder { color: var(--graphite); }
.drill-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--graphite); }

.drill-cols { display: grid; gap: var(--space-3); margin-top: var(--space-3); }
.drill-cols.cols-1 { grid-template-columns: 1fr; }
.drill-cols.cols-2 { grid-template-columns: 1fr 1fr; }
.drill-cols.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 900px) { .drill-cols.cols-2, .drill-cols.cols-3 { grid-template-columns: 1fr; } }

.drill-col-head { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--graphite); text-transform: uppercase; letter-spacing: 0.07em; padding: 0 var(--space-3) var(--space-2); }
.drill-list { display: flex; flex-direction: column; gap: 2px; }
.drill-row {
  display: flex; align-items: center; gap: 10px; padding: 9px var(--space-3);
  border-radius: var(--radius-sm); cursor: pointer; border: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.drill-row:hover { background: var(--steel-2); }
.drill-row.is-selected { background: var(--redline-wash); border-color: rgba(255,90,51,0.35); }
.drill-row .rn { font-size: var(--text-small); color: var(--silver); flex: 1; min-width: 0; }
.drill-row.is-selected .rn { color: var(--paper); }
.drill-row .rv { font-family: var(--font-mono); font-size: var(--text-caption); color: var(--fog); }
.drill-row .rt {
  font-family: var(--font-mono); font-size: var(--text-micro); color: var(--graphite); width: 42px; text-align: right;
}

.detail-panel { margin-top: var(--space-4); }
.detail-panel-empty {
  border: 1px dashed var(--line-strong); border-radius: var(--radius-md); padding: var(--space-8) var(--space-5);
  text-align: center; color: var(--graphite); font-size: var(--text-small);
}

/* ---------------- Deals list ---------------- */
.deals-tabs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.deals-tab {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: none; color: var(--fog); font-size: var(--text-small); cursor: pointer;
  white-space: nowrap; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.deals-tab:hover { background: var(--steel-2); }
.deals-tab.is-active { background: var(--steel-2); color: var(--paper); border-color: var(--line); }
.deals-tab .count { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--graphite); background: var(--steel-3); border-radius: var(--radius-pill); padding: 1px 7px; }
.deals-tab.is-active .count { color: var(--paper); }
.deals-tab.is-action .count { color: var(--signal-red); }

.deals-toolbar { display: flex; align-items: center; gap: 10px; margin: var(--space-4) 0; flex-wrap: wrap; }
.search-input { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
.search-input input {
  width: 100%; background: var(--steel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 8px 12px 8px 34px; color: var(--silver); font-size: var(--text-small);
}
.search-input input::placeholder { color: var(--graphite); }
.search-input svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--graphite); }

.filter-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: center; gap: 6px; background: var(--steel-2); border: 1px solid var(--line);
  border-radius: var(--radius-pill); padding: 4px 6px 4px 10px; font-size: var(--text-caption); color: var(--silver);
}
.chip button { display: flex; color: var(--graphite); background: none; border: none; cursor: pointer; padding: 2px; border-radius: 50%; }
.chip button:hover { color: var(--paper); background: var(--steel-3); }
.chip button svg { width: 11px; height: 11px; }
.filters-count { font-size: var(--text-caption); color: var(--graphite); }

.filter-panel {
  background: var(--steel); border: 1px solid var(--line-strong); border-radius: var(--radius-md);
  padding: var(--space-4); margin-bottom: var(--space-4);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-4);
}
.filter-field label { display: block; font-size: var(--text-micro); color: var(--graphite); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-family: var(--font-mono); }
.filter-field select, .filter-field input {
  width: 100%; background: var(--steel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 9px; color: var(--silver); font-size: var(--text-small);
}
.filter-panel-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; padding-top: var(--space-2); border-top: 1px solid var(--line-faint); }

.deals-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); }
table.deals-table { width: 100%; border-collapse: collapse; min-width: 760px; }
.deals-table thead th {
  text-align: left; font-size: var(--text-micro); color: var(--graphite); text-transform: uppercase; letter-spacing: 0.06em;
  padding: 10px var(--space-4); border-bottom: 1px solid var(--line); background: var(--steel); font-weight: 600;
  font-family: var(--font-mono);
}
.deals-table tbody td { padding: 12px var(--space-4); border-bottom: 1px solid var(--line-faint); font-size: var(--text-small); vertical-align: middle; }
.deals-table tbody tr { cursor: pointer; transition: background var(--dur-fast) var(--ease-out); background: var(--steel); }
.deals-table tbody tr:hover { background: var(--steel-2); }
.deals-table tbody tr:last-child td { border-bottom: none; }
.dt-name { color: var(--paper); font-weight: 550; }
.dt-id { color: var(--graphite); font-family: var(--font-mono); font-size: var(--text-micro); }
.dt-sub { color: var(--graphite); font-size: var(--text-micro); margin-top: 1px; }
.dt-course { color: var(--fog); }
.dt-date { font-family: var(--font-mono); color: var(--fog); font-size: var(--text-caption); }
.dt-actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.deals-table tbody tr:hover .dt-actions, .deals-table tbody tr:focus-within .dt-actions { opacity: 1; }
.dt-actions .icon-btn { width: 28px; height: 28px; }

.assignee-trigger {
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--fog);
  border-bottom: 1px dashed var(--line-strong); padding-bottom: 1px;
}
.assignee-trigger:hover { color: var(--silver); border-color: var(--fog); }
.assignee-pop {
  position: fixed; background: var(--steel-3); border: 1px solid var(--line-strong); border-radius: var(--radius-md);
  padding: var(--space-3); width: 220px; z-index: 80; box-shadow: var(--shadow-xl);
  opacity: 0; transform: translateY(4px); transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  pointer-events: none;
}
.assignee-pop.is-open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.assignee-pop-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: var(--text-caption); }
.assignee-pop-row .k { color: var(--graphite); font-family: var(--font-mono); font-size: var(--text-micro); }
.assignee-pop-row .v { color: var(--silver); }

.empty-state { padding: var(--space-9) var(--space-5); text-align: center; color: var(--graphite); }
.empty-state svg { width: 34px; height: 34px; margin: 0 auto var(--space-3); color: var(--line-strong); }

/* ---------------- Deal Detail ---------------- */
.deal-detail-grid { display: grid; grid-template-columns: 300px 1fr 300px; gap: var(--space-5); align-items: start; }
@media (max-width: 1080px) { .deal-detail-grid { grid-template-columns: 1fr; } }

.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--graphite); font-size: var(--text-caption); margin-bottom: var(--space-4); cursor: pointer; background: none; border: none; padding: 0; }
.back-link:hover { color: var(--silver); }
.back-link svg { width: 13px; height: 13px; }

.dd-header { margin-bottom: var(--space-5); }
.dd-id-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.dd-name { font-size: var(--text-h1); color: var(--paper); font-weight: 550; }
.dd-meta-line { display: flex; gap: var(--space-4); color: var(--graphite); font-size: var(--text-caption); margin-top: 6px; flex-wrap: wrap; }
.dd-meta-line .mi { display: flex; align-items: center; gap: 5px; }
.dd-meta-line svg { width: 13px; height: 13px; }
.dd-actions-row { display: flex; gap: 8px; margin-top: var(--space-4); flex-wrap: wrap; }

.side-block { background: var(--steel); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); box-shadow: var(--shadow-xs); }
.side-block h4 { font-size: var(--text-caption); color: var(--graphite); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); margin-bottom: var(--space-3); }
.side-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: var(--text-small); border-bottom: 1px solid var(--line-faint); }
.side-row:last-child { border-bottom: none; }
.side-row .k { color: var(--graphite); }
.side-row .v { color: var(--silver); text-align: right; }
.copy-id { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: var(--text-caption); color: var(--fog); cursor: pointer; background: none; border: none; padding: 2px 0; }
.copy-id:hover { color: var(--silver); }
.copy-id svg { width: 12px; height: 12px; }
.ext-link-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--steel-2); color: var(--silver); font-size: var(--text-small);
  margin-bottom: 6px; cursor: pointer;
}
.ext-link-btn:hover { border-color: var(--line-strong); background: var(--steel-3); }
.ext-link-btn svg:first-child { width: 15px; height: 15px; color: var(--graphite); }
.ext-link-btn svg:last-child { width: 12px; height: 12px; margin-left: auto; color: var(--graphite); }

.section-card { margin-bottom: var(--space-4); }
.section-head {
  display: flex; align-items: center; gap: 10px; padding: var(--space-4);
  cursor: pointer; user-select: none;
}
.section-head .si {
  width: 24px; height: 24px; border-radius: 50%; background: var(--steel-2); border: 1px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--fog); flex: none;
}
.section-head.is-complete .si { background: var(--signal-green-wash); color: var(--signal-green); border-color: transparent; }
.section-head .st { font-size: var(--text-small); font-weight: 600; color: var(--paper); flex: 1; }
.section-head .schev { width: 15px; height: 15px; color: var(--graphite); transition: transform var(--dur-base) var(--ease-out); }
.section-card.is-open .schev { transform: rotate(180deg); }
.section-body {
  max-height: 0; overflow: hidden; transition: max-height var(--dur-slow) var(--ease-in-out);
}
.section-card.is-open .section-body { max-height: 900px; }
.section-body-inner { padding: 0 var(--space-4) var(--space-4); border-top: 1px solid var(--line-faint); }

.fee-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: var(--text-small); }
.fee-line.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-weight: 600; color: var(--paper); }
.fee-line .fv { font-family: var(--font-mono); }

.installment-row {
  display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3);
  border: 1px solid var(--line); border-radius: var(--radius-sm); margin-top: 8px;
}
.installment-row .ii { flex: none; width: 30px; height: 30px; border-radius: 7px; background: var(--steel-2); display: flex; align-items: center; justify-content: center; color: var(--graphite); }
.installment-row .ii svg { width: 14px; height: 14px; }
.installment-main { flex: 1; min-width: 0; }
.installment-main .im-top { display: flex; justify-content: space-between; font-size: var(--text-small); color: var(--silver); }
.installment-main .im-amt { font-family: var(--font-mono); font-weight: 600; color: var(--paper); }
.installment-main .im-bottom { display: flex; gap: 8px; margin-top: 3px; font-size: var(--text-micro); color: var(--graphite); }

.timeline { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 10px; position: relative; padding-bottom: var(--space-4); }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: 6px; top: 18px; bottom: 0; width: 1px; background: var(--line);
}
.tl-item:last-child::before { display: none; }
.tl-dot { width: 13px; height: 13px; border-radius: 50%; flex: none; margin-top: 2px; background: var(--steel-2); border: 2px solid var(--line-strong); z-index: 1; }
.tl-item.is-done .tl-dot { background: var(--redline); border-color: var(--redline); }
.tl-item.is-current .tl-dot { border-color: var(--redline); }
.tl-text { font-size: var(--text-caption); color: var(--fog); }
.tl-item.is-done .tl-text { color: var(--silver); }

.log-item { padding: 10px 0; border-bottom: 1px solid var(--line-faint); }
.log-item:last-child { border-bottom: none; }
.log-text { font-size: var(--text-caption); color: var(--silver); }
.log-reason { font-size: var(--text-micro); color: var(--graphite); margin-top: 3px; font-style: italic; }
.log-time { font-size: var(--text-micro); color: var(--graphite); font-family: var(--font-mono); margin-top: 3px; }

          '<circle class="trend-dot" cx="' + x(points.length - 1).toFixed(1) + '" cy="' + y(points[points.length - 1].cumulative).toFixed(1) + '" r="3.2"></circle>' +
          '<rect class="trend-hit" x="0" y="0" width="' + w + '" height="' + h + '" fill="transparent"></rect>' +

      path.style.strokeDasharray = len;

/* === js/components/dealsList.js === */
/* ============================================================
   OMS v3 — Deals list. Status tabs whose counts are always derived
   from the same filtered set the table shows (fixes the confirmed

   columns, and inline row actions.

(function (OMS) {
  "use strict";
  var U = OMS.utils, I = OMS.icons, D = OMS.data;

  var TABS = [
    { key: "all", label: "All" },
    { key: "application", label: "Application", test: function (d) { return d.status.stage === "Application"; } },
    { key: "offer", label: "Offer", test: function (d) { return d.status.stage === "Offer"; } },
    { key: "payment", label: "Payment", test: function (d) { return d.status.stage === "Payment"; } },
    { key: "action", label: "Action Required", action: true, test: function (d) { return d.status.action; } },
    { key: "closed", label: "Closed", test: function (d) { return d.status.stage === "Global" || d.status.id === "ENR_CANCELLED"; } }
  ];
  TABS[0].test = function () { return true; };

  var popoverEl = null;
  function ensurePopover() {
    if (!popoverEl) {
      popoverEl = document.createElement("div");
      popoverEl.className = "assignee-pop";

    }
    return popoverEl;
  }

  function render(container) {
    var person = OMS.store.currentPerson();
    var canSeePeopleFilters = person.role === "TL" || person.role === "TM" || person.role === "ADMIN";
    var scoped = D.dealsForPerson(person.id);

    var state = {
      tab: "all", search: "", filtersOpen: false,
      filters: { course: "", currency: "", person: "", updated: "" }
    };

    var el = document.createElement("div");
    el.className = "page";
    el.innerHTML =
      '<div class="page-head" data-reveal>' +
        '<div><div class="page-title">Deals</div><div class="page-sub">' + scoped.length + " deal" + (scoped.length === 1 ? "" : "s") + " in view — scoped to " + (person.role === "ADMIN" ? "the whole floor" : person.role === "BDR" || person.role === "ATL" ? "you" : "your team") + ".</div></div>" +
        '<div class="deals-toolbar" style="margin:0">' +
          '<div class="search-input">' + I.search + '<input type="text" placeholder="Search name or email…" data-search /></div>' +
          '<button class="btn btn-secondary btn-sm" data-toggle-filters>' + I.filter + "Filters</button>" +
        "</div>" +
      "</div>" +
      '<div class="deals-tabs" id="deals-tabs" data-reveal data-reveal-delay="60"></div>' +
      '<div id="filter-panel-mount"></div>' +
      '<div id="chips-mount"></div>' +
      '<div class="deals-table-wrap" data-reveal data-reveal-delay="120"><table class="deals-table">' +
        '<thead><tr>' +
          "<th>Applicant</th><th>Course</th><th>Status</th><th>Created</th><th>Last update</th><th>Assigned</th><th></th>" +
        '</tr></thead><tbody id="deals-tbody"></tbody>' +
      "</table></div>";
    container.appendChild(el);

    paintFilterPanel();
    paintAll();
    U.initScrollReveal(el);

    U.on(el, "input", "[data-search]", U.debounce(function (e) { state.search = e.target.value.toLowerCase(); paintAll(); }, 140));
    U.on(el, "click", "[data-toggle-filters]", function () { state.filtersOpen = !state.filtersOpen; paintFilterPanel(); });
    U.on(el, "click", "[data-tab]", function (e, btn) { state.tab = btn.getAttribute("data-tab"); paintAll(); });
    U.on(el, "click", "[data-clear-filters]", function () { state.filters = { course: "", currency: "", person: "", updated: "" }; paintAll(); });
    U.on(el, "click", "[data-remove-filter]", function (e, btn) { state.filters[btn.getAttribute("data-remove-filter")] = ""; paintAll(); });
    U.on(el, "change", "[data-filter]", function (e, elx) { state.filters[elx.getAttribute("data-filter")] = elx.value; paintAll(); });
    U.on(el, "click", "[data-row]", function (e, row) {
      if (e.target.closest("[data-stop]")) return;
      OMS.store.openDeal(row.getAttribute("data-row"));
    });
    U.on(el, "mouseenter", "[data-assignee]", function (e, trig) { showAssignee(trig); });
    U.on(el, "mouseleave", "[data-assignee]", function () { hideAssignee(); });
    U.on(el, "click", "[data-action]", function (e, btn) {
      e.stopPropagation();
      var dealId = btn.getAttribute("data-deal");
      var action = btn.getAttribute("data-action");
      handleRowAction(action, dealId);
    });

    function filteredDeals() {
      return scoped.filter(function (d) {
        if (state.search && d.name.toLowerCase().indexOf(state.search) === -1 && d.email.toLowerCase().indexOf(state.search) === -1) return false;
        if (state.filters.course && d.course.id !== state.filters.course) return false;
        if (state.filters.currency && d.currency !== state.filters.currency) return false;
        if (state.filters.person && d.bdrId !== state.filters.person) return false;
        if (state.filters.updated) {
          var days = { "7": 7, "30": 30, "90": 90 }[state.filters.updated];
          var diff = (D.NOW - d.lastUpdate) / 86400000;
          if (diff > days) return false;
        }

      });
    }

    function paintAll() {

      paintTabs(filtered);
      paintChips();
      var tabDeals = filtered.filter(TABS.filter(function (t) { return t.key === state.tab; })[0].test)
        .sort(function (a, b) { return b.lastUpdate - a.lastUpdate; });
      paintTable(tabDeals);
    }

    function paintTabs(filtered) {
      el.querySelector("#deals-tabs").innerHTML = TABS.map(function (t) {
        var n = filtered.filter(t.test).length;
        return '<button class="deals-tab' + (state.tab === t.key ? " is-active" : "") + (t.action ? " is-action" : "") + '" data-tab="' + t.key + '">' +
          U.escapeHtml(t.label) + '<span class="count tnum">' + n + "</span></button>";
      }).join("");
    }

    function paintChips() {
      var chips = [];
      if (state.filters.course) chips.push(["course", D.COURSES.find(function (c) { return c.id === state.filters.course; }).short]);
      if (state.filters.currency) chips.push(["currency", state.filters.currency]);
      if (state.filters.person) chips.push(["person", D.PEOPLE_BY_ID[state.filters.person].name]);
      if (state.filters.updated) chips.push(["updated", "Updated ≤ " + state.filters.updated + "d"]);

        '<span class="filters-count">' + chips.length + " filter" + (chips.length > 1 ? "s" : "") + " applied</span>" +
        '<div class="filter-chips">' + chips.map(function (c) {
          return '<span class="chip">' + U.escapeHtml(c[1]) + '<button data-remove-filter="' + c[0] + '">' + I.x + "</button></span>";
        }).join("") + '<button class="btn btn-ghost btn-sm" data-clear-filters>Clear all</button></div>' +
      "</div>";

        rows.map(function (r) { return '<div class="side-row"><span class="k">' + r[0] + '</span><span class="v">' + U.escapeHtml(r[1]) + "</span></div>"; }).join("") +
      "</div>";
    }
  }

  OMS.dealDetailComponent = { render: render };
})(window.OMS = window.OMS || {});


/* === js/components/offerWizard.js === */
/* ============================================================
   OMS v3 — Offer Wizard: Create Payment Plan → Choose Template.
   Carries forward the two guardrails the source spec calls out
   as worth keeping: a live "Amount Left" validator, and a live
   preview of the exact email before it sends.
   ============================================================ */
(function (OMS) {
  "use strict";
  var U = OMS.utils, I = OMS.icons, D = OMS.data;

  var MODES_INR = ["Razorpay", "Manual", "EMI_3P"];
  var MODES_USD = ["Stripe", "Stripe EMI"];
  var EMI_TENURES = [3, 6, 12];

  function open(dealId, opts) {
    opts = opts || {};
    var d = D.dealById(dealId);
    var isRevise = d.reachedStage >= 1;

    var state = {
      step: 1,
      planType: d.installments.length > 1 ? "part" : "upfront",
      discount: d.discount || 0,
      installments: d.installments.length ? d.installments.map(function (i) { return { amount: i.amount, mode: i.mode, deadline: i.deadline, isEmi: i.isEmi, emiMonths: i.emiMonths }; }) :
        [{ amount: Math.max(0, d.courseFee - (d.discount || 0)), mode: d.currency === "INR" ? "Razorpay" : "Stripe", deadline: isoInDays(14), isEmi: false, emiMonths: null }],
      templateId: "with-scholarship",
      offerDeadline: isoInDays(7)
    };

    var scrim = document.createElement("div"); scrim.className = "overlay-scrim";
    var panel = document.createElement("div"); panel.className = "wizard-panel";
    document.body.appendChild(scrim); document.body.appendChild(panel);
    requestAnimationFrame(function () { scrim.classList.add("is-open"); panel.classList.add("is-open"); document.body.style.overflow = "hidden"; });

    function close() {
      scrim.classList.remove("is-open"); panel.classList.remove("is-open");
      document.body.style.overflow = "";
      setTimeout(function () { scrim.remove(); panel.remove(); }, 380);
    }
    scrim.addEventListener("click", close);

    function netPayable() { return Math.max(0, d.courseFee - Number(state.discount || 0)); }
    function totalAssigned() { return state.installments.reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0); }
    function amountLeft() { return state.planType === "upfront" ? 0 : netPayable() - totalAssigned(); }

    function paintChrome() {
      panel.innerHTML =
        '<div class="wizard-head">' +
          '<div><div class="panel-title">' + (isRevise ? "Revise" : "Send") + " offer letter</div>" +
          '<div style="font-size:var(--text-caption);color:var(--graphite);margin-top:2px">' + U.escapeHtml(d.name) + " · " + d.course.short + "</div></div>" +
          '<div class="wizard-steps">' +
            step(1, "Payment Plan") + '<span class="wizard-step-line"></span>' + step(2, "Template") +
          "</div>" +
          '<button class="icon-btn" data-close>' + I.x + "</button>" +
        "</div>" +
        '<div class="wizard-body" id="wiz-body"></div>' +
        '<div class="wizard-foot" id="wiz-foot"></div>';
      panel.querySelector("[data-close]").addEventListener("click", close);
      paintBody(); paintFoot();
      function step(n, label) {
        var cls = state.step === n ? "is-active" : state.step > n ? "is-done" : "";
        return '<div class="wizard-step-dot ' + cls + '"><span class="n">' + (state.step > n ? "✓" : n) + "</span>" + label + "</div>";
      }
    }

    function paintBody() {
      var body = panel.querySelector("#wiz-body");
      if (state.step === 1) {
        body.className = "wizard-body";
        body.innerHTML = '<div class="wizard-form">' + step1Html() + "</div>";
        bindStep1();
      } else if (state.step === 2) {
        body.className = "wizard-body has-preview";
        body.innerHTML = '<div class="wizard-form">' + step2Html() + '</div><div class="wizard-preview" id="wiz-preview"></div>';
        paintPreview();
        bindStep2();
      } else {
        body.className = "wizard-body";
        body.innerHTML =
          '<div class="confirm-screen">' +
            '<div class="confirm-icon">' + I.check + "</div>" +
            '<div class="confirm-title">Offer sent to ' + U.escapeHtml(d.name.split(" ")[0]) + "!</div>" +
            '<div class="confirm-sub">They’ll receive it by email, with a link back to their offer. You can track acceptance from their Deal.</div>' +
            '<button class="btn btn-primary" style="margin-top:24px" data-goto-deal>' + I.arrowRight + "View deal</button>" +
          "</div>";
        var gotoBtn = panel.querySelector("[data-goto-deal]");
        if (gotoBtn) gotoBtn.addEventListener("click", function () { close(); OMS.store.openDeal(d.id); });
      }
    }

    function step1Html() {
      var modes = d.currency === "INR" ? MODES_INR : MODES_USD;
      return (
        '<div class="field-group">' +
          '<label>Payment type</label>' +
          '<div class="segmented" id="plan-type-toggle">' +
            '<button data-plan="upfront" class="' + (state.planType === "upfront" ? "is-active" : "") + '">Upfront</button>' +
            '<button data-plan="part" class="' + (state.planType === "part" ? "is-active" : "") + '">Part Payment</button>' +
          "</div>" +
        "</div>" +
        '<div class="field-group">' +
          '<label>Discount (' + d.currency + ")</label>" +
          '<input type="number" id="discount-input" value="' + state.discount + '" min="0" max="' + d.courseFee + '" />' +
        "</div>" +
        '<div class="field-group">' +
          '<div class="fee-line"><span>Course Fee</span><span class="fv">' + U.fmtMoneyFull(d.courseFee, d.currency) + "</span></div>" +
          '<div class="fee-line total"><span>Net Payable Fee</span><span class="fv" id="net-payable-fig">' + U.fmtMoneyFull(netPayable(), d.currency) + "</span></div>" +
        "</div>" +
        '<div class="field-group" id="installments-field">' +
          '<label>Installments</label>' +
          '<div id="installments-list">' + state.installments.map(function (r, i) { return installmentRowHtml(r, i, modes); }).join("") + "</div>" +
          (state.planType === "part" ? '<button class="btn btn-secondary btn-sm" id="add-installment">' + I.plus + "Add Installment</button>" : "") +
        "</div>" +
        (state.planType === "part" ? amountLeftHtml() : "")
      );
    }

    function installmentRowHtml(r, i, modes) {
      return '<div class="installment-builder-row" data-row="' + i + '">' +
        (state.planType === "part" ?
          '<div><label style="font-size:11px;color:var(--graphite);display:block;margin-bottom:4px">Amount</label><input type="number" class="inst-amount" data-idx="' + i + '" value="' + r.amount + '" /></div>' :
          '<div><label style="font-size:11px;color:var(--graphite);display:block;margin-bottom:4px">Amount</label><input type="number" value="' + netPayable() + '" disabled /></div>') +
        '<div><label style="font-size:11px;color:var(--graphite);display:block;margin-bottom:4px">Mode</label><select class="inst-mode" data-idx="' + i + '">' +
          modes.map(function (m) { return '<option value="' + m + '"' + (r.mode === m ? " selected" : "") + ">" + m + "</option>"; }).join("") +
        "</select></div>" +
        (r.isEmi ?
          '<div><label style="font-size:11px;color:var(--graphite);display:block;margin-bottom:4px">Start date</label><input type="date" class="inst-deadline" data-idx="' + i + '" value="' + r.deadline + '" /></div>' :
          '<div><label style="font-size:11px;color:var(--graphite);display:block;margin-bottom:4px">Deadline</label><input type="date" class="inst-deadline" data-idx="' + i + '" value="' + r.deadline + '" /></div>') +
        (state.planType === "part" && state.installments.length > 1 ?
          '<button class="icon-btn rm-btn" data-remove="' + i + '" title="Remove">' + I.trash + "</button>" : "<span></span>") +
        (r.isEmi ? emiCardsHtml(r, i) : "") +
      "</div>";
    }

    function emiCardsHtml(r, i) {
      return '<div class="emi-cards" style="grid-column:1/-1">' + EMI_TENURES.map(function (m) {
        var monthly = Math.round((Number(r.amount) || 0) / m);
        var interest = Math.round((Number(r.amount) || 0) * (m === 3 ? 0.03 : m === 6 ? 0.06 : 0.1));
        return '<div class="emi-card' + (r.emiMonths === m ? " is-selected" : "") + '" data-emi-select="' + i + '" data-months="' + m + '">' +
          '<div class="em">' + U.fmtMoneyFull(monthly, d.currency) + " / mo</div>" +
          '<div class="ei">for ' + m + " months · " + U.fmtMoneyFull(interest, d.currency) + " interest</div>" +
        "</div>";
      }).join("") + '<div style="grid-column:1/-1;font-size:11px;color:var(--graphite);margin-top:4px">Payment link will be sent to the learner directly by the gateway.</div></div>';
    }

    function amountLeftHtml() {
      var left = amountLeft();
      var settled = left === 0;
      return '<div class="amount-left-bar" id="amount-left-bar">' +
        '<div class="al-row"><span class="al-label">Amount Left</span><span class="al-value ' + (settled ? "is-settled" : "is-open") + '" id="al-value">' + U.fmtMoneyFull(left, d.currency) + "</span></div>" +
        '<div class="al-track"><div class="al-fill ' + (settled ? "is-settled" : "") + '" id="al-fill" style="width:' + Math.min(100, Math.round((totalAssigned() / (netPayable() || 1)) * 100)) + '%"></div></div>' +
      "</div>";
    }

    function step2Html() {
      return D.OFFER_TEMPLATES.map(function (t) {
        return '<div class="template-card' + (state.templateId === t.id ? " is-selected" : "") + '" data-template="' + t.id + '">' +
          '<span class="radio"></span><div><div class="tn">' + t.name + '</div><div class="tb">' + t.blurb + "</div></div>" +
        "</div>";
      }).join("") +
      '<div class="field-group" style="margin-top:20px"><label>Choose deadline</label><input type="date" id="offer-deadline" value="' + state.offerDeadline + '" /></div>';
    }

    function paintPreview() {
      var host = panel.querySelector("#wiz-preview");
      var tpl = D.OFFER_TEMPLATES.filter(function (t) { return t.id === state.templateId; })[0];
      var discountPct = d.courseFee ? Math.round((state.discount / d.courseFee) * 100) : 0;
      host.innerHTML =
        '<div class="email-preview">' +
          '<div class="email-preview-header"><div class="eb">Exclusive offer</div><div class="et">' + d.course.name + " — for Career Growth</div></div>" +
          '<div class="email-preview-body">' +
            "<p>Hi " + d.name.split(" ")[0] + ",</p>" +
            "<p>Congratulations — you’re one step away from starting <strong style=\"color:var(--paper)\">" + d.course.name + "</strong>. This offer (" + tpl.name + ") is valid until <strong style=\"color:var(--paper)\">" + U.fmtDate(new Date(state.offerDeadline)) + "</strong>.</p>" +
            '<div class="email-cta">Accept Your Offer</div>' +
            (state.discount > 0 ? '<p>Your personalised scholarship: <span class="email-discount-tag">' + U.fmtMoneyFull(state.discount, d.currency) + " (" + discountPct + "% off)</span></p>" : "") +
            benefit("No-cost EMI options, up to 24 months") + benefit("Reduced down payment for the next cohort") +
            benefit("Recorded material for two electives") + benefit("Early access to pre-course material") +
          "</div>" +
        "</div>";
      function benefit(text) { return '<div class="email-benefit">' + I.check + "<span>" + text + "</span></div>"; }
    }

    function paintFoot() {
      var foot = panel.querySelector("#wiz-foot");
      if (state.step === 3) { foot.innerHTML = ""; return; }
      var nextDisabled = state.step === 1 && state.planType === "part" && amountLeft() !== 0;
      foot.innerHTML =
        '<span class="wizard-foot-note">*Lead will receive this offer on their email</span>' +
        '<div style="display:flex;gap:8px">' +
          (state.step === 2 ? '<button class="btn btn-secondary" data-back>' + I.chevronLeft + "Back</button>" : "") +
          '<button class="btn btn-primary" data-next' + (nextDisabled ? " disabled" : "") + ">" + (state.step === 1 ? "Next Step" : "Send") + (state.step === 1 ? "" : "") + "</button>" +
        "</div>";
      var nextBtn = foot.querySelector("[data-next]");
      if (nextBtn) nextBtn.addEventListener("click", function () {
        if (nextDisabled) return;
        if (state.step === 1) { state.step = 2; paintChrome(); }
        else if (state.step === 2) { submit(); }
      });
      var backBtn = foot.querySelector("[data-back]");
      if (backBtn) backBtn.addEventListener("click", function () { state.step = 1; paintChrome(); });
    }

    function bindStep1() {
      var body = panel.querySelector("#wiz-body");
      body.querySelectorAll("[data-plan]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.planType = btn.getAttribute("data-plan");
          if (state.planType === "upfront") {
            state.installments = [{ amount: netPayable(), mode: state.installments[0].mode, deadline: isoInDays(14), isEmi: false, emiMonths: null }];
          } else if (state.installments.length === 1) {
            state.installments[0].amount = netPayable();
          }
          rebuildStep1();
        });
      });
      body.querySelector("#discount-input").addEventListener("input", function (e) {
        state.discount = Number(e.target.value) || 0;
        panel.querySelector("#net-payable-fig").textContent = U.fmtMoneyFull(netPayable(), d.currency);
        if (state.planType === "upfront") { state.installments[0].amount = netPayable(); body.querySelector('.inst-amount, input[disabled]').value = netPayable(); }
        updateAmountLeftOnly();
      });
      body.addEventListener("input", function (e) {
        if (e.target.classList.contains("inst-amount")) {
          var idx = Number(e.target.getAttribute("data-idx"));
          state.installments[idx].amount = Number(e.target.value) || 0;
          updateAmountLeftOnly();
        }
      });
      body.addEventListener("change", function (e) {
        if (e.target.classList.contains("inst-mode")) {
          var idx = Number(e.target.getAttribute("data-idx"));
          var mode = e.target.value;
          state.installments[idx].mode = mode;
          state.installments[idx].isEmi = /EMI/.test(mode);
          if (state.installments[idx].isEmi && !state.installments[idx].emiMonths) state.installments[idx].emiMonths = 6;
          rebuildStep1();
        }
        if (e.target.classList.contains("inst-deadline")) {
          var idx2 = Number(e.target.getAttribute("data-idx"));
          state.installments[idx2].deadline = e.target.value;
        }
      });
      body.addEventListener("click", function (e) {
        var addBtn = e.target.closest("#add-installment");
        if (addBtn) {
          state.installments.push({ amount: Math.max(0, amountLeft()), mode: d.currency === "INR" ? "Razorpay" : "Stripe", deadline: isoInDays(21), isEmi: false, emiMonths: null });
          rebuildStep1(); return;
        }
        var rm = e.target.closest("[data-remove]");
        if (rm) { state.installments.splice(Number(rm.getAttribute("data-remove")), 1); rebuildStep1(); return; }
        var emiSel = e.target.closest("[data-emi-select]");
        if (emiSel) {
          var i = Number(emiSel.getAttribute("data-emi-select"));
          state.installments[i].emiMonths = Number(emiSel.getAttribute("data-months"));
          rebuildStep1(); return;
        }
      });
    }

    function rebuildStep1() {
      var body = panel.querySelector("#wiz-body");
      body.innerHTML = '<div class="wizard-form">' + step1Html() + "</div>";
      bindStep1();
      paintFoot();
    }

    function updateAmountLeftOnly() {
      var bar = panel.querySelector("#amount-left-bar");
      if (!bar) return;
      var left = amountLeft(), settled = left === 0;
      var valEl = panel.querySelector("#al-value"), fillEl = panel.querySelector("#al-fill");
      valEl.textContent = U.fmtMoneyFull(left, d.currency);
      valEl.className = "al-value " + (settled ? "is-settled" : "is-open");
      fillEl.className = "al-fill " + (settled ? "is-settled" : "");
      fillEl.style.width = Math.min(100, Math.round((totalAssigned() / (netPayable() || 1)) * 100)) + "%";
      paintFoot();
    }

    function bindStep2() {
      var body = panel.querySelector("#wiz-body");
      body.querySelectorAll("[data-template]").forEach(function (card) {
        card.addEventListener("click", function () {
          state.templateId = card.getAttribute("data-template");
          body.querySelectorAll("[data-template]").forEach(function (c) { c.classList.toggle("is-selected", c === card); });
          paintPreview();
        });
      });
      body.querySelector("#offer-deadline").addEventListener("input", function (e) { state.offerDeadline = e.target.value; paintPreview(); });
    }

    function submit() {
      d.courseFee = d.courseFee; // unchanged
      d.discount = state.discount;
      d.netPayable = netPayable();
      d.installments = state.installments.map(function (r, i) {
        return {
          label: state.planType === "part" ? "Installment " + (i + 1) : "Full payment",
          amount: Number(r.amount) || 0, mode: r.mode, isEmi: r.isEmi,
          emiMonths: r.isEmi ? r.emiMonths : null,
          emiInterest: r.isEmi ? Math.round(r.amount * 0.06) : null,
          deadline: r.deadline, status: "Unpaid"
        };
      });
      d.status = D.STATUS.OFFER_PENDING;
      d.reachedStage = Math.max(d.reachedStage, 1);
      d.lastUpdate = D.NOW;
      D.logActivity(d, isRevise ? "Offer letter revised" : "Offer letter sent", D.OFFER_TEMPLATES.filter(function (t) { return t.id === state.templateId; })[0].name + " template");
      state.step = 3;
      paintChrome();
      if (opts.onDone) opts.onDone();
    }

    function isoInDays(n) { var dt = new Date(D.NOW.getTime() + n * 86400000); return dt.toISOString().slice(0, 10); }

    paintChrome();
  }

  OMS.offerWizard = { open: open };
})(window.OMS = window.OMS || {});


/* === js/app.js === */
/* ============================================================
   OMS v3 — App bootstrap / router
   ============================================================ */
(function (OMS) {
  "use strict";

  var appEl = document.getElementById("app-view");
  var sidebarEl = document.getElementById("app-sidebar");
  var topbarEl = document.getElementById("mobile-topbar");
  var scrimEl = document.getElementById("sidebar-scrim");
  var contentEl = document.getElementById("app-content");
  var navMounted = false;

  function openApp() {
    appEl.classList.add("is-active");
    document.body.style.overflow = "";
    if (!navMounted) { OMS.navComponent.render({ sidebar: sidebarEl, topbar: topbarEl, scrim: scrimEl }); navMounted = true; }
    renderRoute();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function renderRoute() {
    var s = OMS.store.get();
    OMS.utils.swapContent(contentEl, function (mount) {
      if (s.route === "deals") OMS.dealsListComponent.render(mount);
      else if (s.route === "dealDetail") OMS.dealDetailComponent.render(mount, s.selectedDealId);
      else OMS.dashboardComponent.render(mount);
    });
  }

  var lastRoute = null, lastPerson = null;
  OMS.store.subscribe(function (s) {
    if (!appEl.classList.contains("is-active")) return;
    if (s.route !== lastRoute || s.personId !== lastPerson) {
      lastRoute = s.route; lastPerson = s.personId;
      renderRoute();
    }
  });

  OMS.app = { openApp: openApp };

  // ---- boot ----
  // The marketing landing page has been removed — this always boots
  // straight into the product now, regardless of embed/hash context.
  openApp();
})(window.OMS = window.OMS || {});

</script>
